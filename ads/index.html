<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>المنادي</title>
<meta name="description" content="منصة إعلانات مبوبة: عروض ووظائف وفعاليات ومناسبات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a classifieds page. Oversized masthead, section chips, then ad boxes set like a newspaper's small ads */
:root {
  --bg: #e9ebe6; --paper: #f8f9f5; --ink: #111512; --muted: #565d57; --line: #111512; --soft-line: #c9cec6;
  --red: #b3201f; --on-red: #ffffff;
  --display: "Aref Ruqaa", "Traditional Arabic", serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101311; --paper: #191d1a; --ink: #eef1ec; --muted: #a7aea8; --line: #eef1ec; --soft-line: #39403a;
    --red: #e8605c; --on-red: #1c0605; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65; }
.wrap { max-width: 860px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.mast { padding-block: 22px 12px; text-align: center; }
.mast h1 { font-family: var(--display); font-size: clamp(3.4rem, 17vw, 6rem); line-height: 1.1; margin: 0; color: var(--red); }
.mast p { margin: 4px 0 0; font-weight: 500; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-block: 3px double var(--line); padding-block: 6px; margin-top: 14px; font-size: .86rem; font-variant-numeric: tabular-nums; }
nav.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px; scrollbar-width: none; }
.chip { flex: none; min-height: 44px; padding: 6px 16px; border: 1.5px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); font: 600 .95rem var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip:focus-visible, a:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
main { display: grid; gap: 22px; padding-block: 4px 44px; }
.ads { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.ad { background: var(--paper); border: 1.5px solid var(--line); padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ad.featured { border: 3px double var(--red); }
.ad .cat { font-size: .78rem; font-weight: 700; color: var(--red); }
.ad h2 { margin: 0; font-size: 1.12rem; line-height: 1.4; overflow-wrap: anywhere; text-wrap: balance; }
.ad p { margin: 0; font-size: .95rem; overflow-wrap: anywhere; white-space: pre-line; }
.ad .foot { margin-top: 4px; font-size: .84rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ad a { color: var(--ink); font-weight: 700; }
.empty { background: var(--paper); border: 1.5px dashed var(--line); padding: 28px 18px; text-align: center; }
.empty h2 { margin: 0 0 4px; font-size: 1.2rem; }
.empty p { margin: 0; color: var(--muted); }
.rates { background: var(--paper); border: 1.5px solid var(--line); padding: 18px; display: grid; gap: 12px; }
.rates h2 { margin: 0; font-family: var(--display); font-size: 1.8rem; line-height: 1.2; }
.rates p { margin: 0; color: var(--muted); }
.table-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td, th { padding: 9px 4px; text-align: start; border-bottom: 1px solid var(--soft-line); }
tr:last-child td { border-bottom: 0; }
td:last-child, th:last-child { text-align: end; font-weight: 700; white-space: nowrap; }
.soon { display: block; background: var(--red); color: var(--on-red); padding: 12px 16px; text-align: center; font-weight: 700; }
footer { border-top: 3px double var(--line); padding-block: 14px 28px; font-size: .84rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>المنادي</h1>
    <p>إعلانات الناس والمحلات في مكان واحد</p>
    <div class="meta"><span id="today"></span><span id="count"></span></div>
  </header>
  <nav class="chips" id="chips" aria-label="أقسام الإعلانات"></nav>
  <main>
    <section id="list" aria-live="polite"></section>
    <section class="rates" id="rates">
      <h2>أعلن في المنادي</h2>
      <p>أسعار البداية للإعلان الواحد والاشتراك الشهري.</p>
      <div class="table-box"><table>
        <tr><td>إعلان عادي</td><td>50 ريال</td></tr>
        <tr><td>إعلان مميز</td><td>150 ريال</td></tr>
        <tr><td>اشتراك شهري للمحل</td><td>300 ريال</td></tr>
      </table></div>
      <span class="soon" id="ad-cta">استقبال الإعلانات يبدأ قريبًا</span>
    </section>
  </main>
  <footer>نراجع الإعلانات قبل نشرها، والمعلن مسؤول عن صحة بياناته.</footer>
</div>
<script>
(function () {
  var CATS = ['الكل', 'عروض', 'وظائف', 'فعاليات', 'مناسبات', 'سيارات', 'متفرقات'];
  var active = 'الكل', ads = [], loaded = false, failed = false;
  var chips = document.getElementById('chips'), list = document.getElementById('list');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(d) {
    try { return new Date(d).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return ''; }
  }
  document.getElementById('today').textContent = fmt(Date.now());

  CATS.forEach(function (c) {
    var b = el('button', 'chip', c);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(c === active));
    b.addEventListener('click', function () {
      active = c;
      Array.prototype.forEach.call(chips.children, function (x) { x.setAttribute('aria-pressed', String(x.textContent === c)); });
      draw();
    });
    chips.appendChild(b);
  });

  function card(a) {
    var box = el('article', 'ad' + (a.featured ? ' featured' : ''));
    box.appendChild(el('span', 'cat', (a.featured ? 'مميز · ' : '') + (a.category || 'متفرقات')));
    box.appendChild(el('h2', '', a.title || ''));
    if (a.body) box.appendChild(el('p', '', a.body));
    var foot = el('div', 'foot');
    foot.appendChild(el('span', '', [a.city, fmt(a.date)].filter(Boolean).join(' · ')));
    if (a.phone && /^\+?[0-9]{8,15}$/.test(a.phone)) {
      var link = el('a', '', a.phone);
      link.href = 'tel:' + a.phone;
      link.dir = 'ltr';
      foot.appendChild(link);
    }
    box.appendChild(foot);
    return box;
  }

  function draw() {
    list.textContent = '';
    var now = Date.now();
    var live = ads.filter(function (a) { return !a.expires || new Date(a.expires).getTime() >= now; });
    document.getElementById('count').textContent = loaded ? live.length + ' إعلان' : '';
    var shown = live.filter(function (a) { return active === 'الكل' || a.category === active; })
      .sort(function (x, y) { return (y.featured ? 1 : 0) - (x.featured ? 1 : 0) || String(y.date).localeCompare(String(x.date)); });
    if (!shown.length) {
      var e = el('div', 'empty');
      e.appendChild(el('h2', '', !loaded && !failed ? 'نجهز الإعلانات...' : failed ? 'ما قدرنا نجيب الإعلانات' : active === 'الكل' ? 'ما فيه إعلانات منشورة للحين' : 'ما فيه إعلانات في هذا القسم'));
      e.appendChild(el('p', '', failed ? 'حدّث الصفحة وجرب مرة ثانية.' : 'أول الإعلانات تنزل هنا بعد الإطلاق.'));
      list.appendChild(e);
      return;
    }
    var g = el('div', 'ads');
    shown.forEach(function (a) { g.appendChild(card(a)); });
    list.appendChild(g);
  }
  draw();
  fetch('ads.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('bad');
    return r.json();
  }).then(function (data) {
    ads = Array.isArray(data.ads) ? data.ads : [];
    loaded = true; draw();
  }).catch(function () { failed = true; draw(); });
})();
</script>
</body>
</html>
