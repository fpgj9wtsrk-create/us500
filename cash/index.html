<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>بطاقة كاش الشمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root {
  --bg: #eff1f6; --surface: #ffffff; --fg: #152140; --muted: #566180; --line: #d6dbe7;
  --panel: #1a2c59; --on-panel: #f4f6fb; --on-panel-muted: #bcc7e2; --accent: #f0b429;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1324; --surface: #171f36; --fg: #e9edf7; --muted: #a2adc8; --line: #2c3654;
    --panel: #22376d; --on-panel: #f4f6fb; --on-panel-muted: #c4cfe8; --accent: #f5c04a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.app { max-width: 480px; margin-inline: auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
h1 { font-family: var(--display); font-size: 1.85rem; margin: 0; line-height: 1.25; }
.sub { margin: 0; color: var(--muted); font-size: .92rem; }
.hero { background: var(--panel); color: var(--on-panel); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.hero h2 { margin: 0; font-family: var(--display); font-size: 1.35rem; line-height: 1.3; overflow-wrap: anywhere; }
.now { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.now span { color: var(--on-panel-muted); font-size: .95rem; }
.now b { font-family: var(--display); color: var(--accent); font-size: 3.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; height: 92px; }
.ladder li { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.ladder i { display: block; border-radius: 4px 4px 0 0; background: var(--on-panel-muted); opacity: .35; }
.ladder .done i { opacity: .8; }
.ladder .here i { background: var(--accent); opacity: 1; }
.ladder em { font-style: normal; font-size: .72rem; text-align: center; color: var(--on-panel-muted); font-variant-numeric: tabular-nums; }
.ladder .here em { color: var(--accent); font-weight: 700; }
.hero small { color: var(--on-panel-muted); font-size: .88rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; }
.panel h2 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.panel p, .panel ol { margin: 0; color: var(--muted); font-size: .94rem; }
.panel ol { padding-inline-start: 20px; display: grid; gap: 4px; }
.scale { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
.scale td { padding-block: 5px; border-bottom: 1px solid var(--line); }
.scale tr:last-child td { border-bottom: 0; }
.scale td:last-child { text-align: end; font-weight: 700; }
footer { text-align: center; }
footer a { color: var(--muted); font-size: .85rem; display: inline-block; padding: 10px; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>كاش الشمال</h1>
    <p class="sub">بطاقة خصوماتك</p>
  </header>
  <div id="root" style="display:grid;gap:14px"></div>
  <footer><a href="https://claude.ai/artifact/2pWxnpcLrS5mazx9gkZms7" rel="noopener">دخول صاحب المحل</a></footer>
</div>
<script>
(function () {
  var KEY = 'cash-alshamal-card';
  var STEPS = [0, 5, 10, 15, 20, 25, 30, 35];
  function pctFor(n) { return Math.min(35, Math.max(0, (n - 1) * 5)); }

  function read() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); return v && typeof v.c === 'number' ? v : null; }
    catch (e) { return null; }
  }
  function write(card) {
    try { localStorage.setItem(KEY, JSON.stringify(card)); return true; } catch (e) { return false; }
  }
  /* The shop's own record decides the discount at the counter, so this card is only a display. */
  function fromHash() {
    var h = new URLSearchParams(location.hash.slice(1));
    var c = parseInt(h.get('c'), 10), t = parseInt(h.get('t'), 10);
    if (!(c >= 0 && c <= 100000) || !(t > 0)) return null;
    return { c: c, t: t, n: String(h.get('n') || '').slice(0, 40) };
  }

  var card = read();
  var incoming = fromHash();
  var unsaved = false;
  if (incoming) {
    if (!card || incoming.t >= card.t) { card = incoming; unsaved = !write(card); }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }

  var root = document.getElementById('root');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function scale() {
    var p = el('div', 'panel');
    p.appendChild(el('h2', '', 'كيف يزيد خصمك؟'));
    var t = el('table', 'scale');
    [['العملية الأولى', 'بدون خصم'], ['الثانية', '5٪'], ['الثالثة', '10٪'], ['الرابعة', '15٪'], ['الخامسة', '20٪'], ['السادسة', '25٪'], ['السابعة', '30٪'], ['الثامنة وما بعدها', '35٪']].forEach(function (r) {
      var tr = el('tr');
      tr.appendChild(el('td', '', r[0]));
      tr.appendChild(el('td', '', r[1]));
      t.appendChild(tr);
    });
    p.appendChild(t);
    p.appendChild(el('p', '', 'الخصم يكون على ربح المحل من العملية، مو على كامل المبلغ.'));
    return p;
  }

  if (card) {
    var next = card.c + 1, pct = pctFor(next), hero = el('div', 'hero');
    hero.appendChild(el('h2', '', card.n ? 'بطاقة ' + card.n : 'بطاقتك'));
    var now = el('div', 'now');
    now.appendChild(el('span', '', 'خصمك على الربح في عمليتك الجاية'));
    now.appendChild(el('b', '', pct + '٪'));
    hero.appendChild(now);
    var ol = el('ol', 'ladder');
    ol.setAttribute('aria-label', 'سلم الخصومات');
    STEPS.forEach(function (p, i) {
      var k = i + 1, cur = Math.min(next, 8);
      var li = el('li', k === cur ? 'here' : (k < cur ? 'done' : ''));
      var bar = el('i');
      bar.style.height = (8 + p * 1.6) + 'px';
      li.appendChild(bar);
      li.appendChild(el('em', '', String(p)));
      ol.appendChild(li);
    });
    hero.appendChild(ol);
    var when = '';
    try { when = new Date(card.t * 1000).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
    hero.appendChild(el('small', '', 'عدد عملياتك: ' + card.c + (when ? ' · آخر تحديث ' + when : '')));
    root.appendChild(hero);
    var info = el('div', 'panel');
    info.appendChild(el('h2', '', 'كيف تتحدث بطاقتك؟'));
    info.appendChild(el('p', '', 'بعد كل عملية صوّر الرمز اللي يطلع لك عند الكاشير. بطاقتك محفوظة في متصفح جوالك فقط، والرقم المعتمد هو سجل المحل.'));
    if (unsaved) info.appendChild(el('p', '', 'متصفحك ما حفظ البطاقة، فبتختفي إذا سكرت الصفحة.'));
    root.appendChild(info);
  } else {
    var start = el('div', 'panel');
    start.appendChild(el('h2', '', 'ما عندك بطاقة في هذا الجوال للحين'));
    var steps = el('ol');
    ['عطِ الكاشير اسمك ورقم جوالك عشان يسجلك.', 'بعد عمليتك صوّر الرمز اللي يطلع له على الشاشة.', 'بعدها كل ما صورت رمز المحل، تشوف بطاقتك وخصمك.'].forEach(function (s) { steps.appendChild(el('li', '', s)); });
    start.appendChild(steps);
    root.appendChild(start);
  }
  root.appendChild(scale());
})();
</script>
</body>
</html>
